<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Store – Cart</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f6f4; color: #1d1d1b; }
      main { max-width: 32rem; margin: 2rem auto; padding: 1.5rem; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      ul { list-style: none; padding: 0; margin: 0 0 1rem; }
      li { border-bottom: 1px solid #eee; padding-bottom: 1rem; }
      h2 { font-size: 1.125rem; margin: 0 0 0.5rem; }
      p { margin: 0.25rem 0; }
      button { margin-top: 0.5rem; font: inherit; padding: 0.4rem 0.8rem; cursor: pointer; }
      .total { font-size: 1.25rem; font-weight: 600; }
      .error { color: #a40000; }
    </style>
  </head>
  <body>
    <main>
      <h1>Your cart</h1>
      <ul aria-label="Cart items">
        <li>
          <h2>Ceramic Mug</h2>
          <p>Unit price: <span data-field="unit-price">…</span></p>
          <p>Quantity: <span data-field="quantity">…</span></p>
          <button type="button" data-action="increase" disabled>Increase quantity</button>
        </li>
      </ul>
      <p class="total">Total: <span data-field="total">…</span></p>
      <p class="error" role="alert" data-field="error" hidden></p>
    </main>
    <script src="/cart.js"></script>
  </body>
</html>
